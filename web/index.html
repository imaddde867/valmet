<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field Device Detector</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="viewer">
        <video id="video" width="640" controls preload="metadata"></video>
        <canvas id="overlay" width="640" height="360" aria-hidden="true"></canvas>
      </div>

      <aside class="controls">
        <header>
          <p class="eyebrow">Valmet Hackathon</p>
          <h1>Field Device Detector</h1>
        </header>

        <section class="panel">
          <label class="slider-label">
            Confidence ≥ <span id="conf-value">0.50</span>
          </label>
          <input id="conf-slider" type="range" min="0.3" max="0.9" step="0.05" value="0.5" />
        </section>

        <section class="panel">
          <h2>Per-frame stats</h2>
          <div id="stats" class="stats">Press play to begin</div>
        </section>

        <section class="panel">
          <h2>Filters</h2>
          <div id="class-filters" class="filters"></div>
        </section>
      </aside>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
