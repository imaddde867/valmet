<body>
  <div id="app" style="display:flex; gap:16px;">
    <div style="position:relative;">
      <video id="video" width="640" controls></video>
      <canvas id="overlay"
              width="640"
              height="360"
              style="position:absolute; left:0; top:0; pointer-events:none;"></canvas>
    </div>

    <div style="min-width:250px; font-family:sans-serif;">
      <h2>Field Device Detector</h2>
      <label>Confidence ≥ <span id="conf-value">0.50</span></label>
      <input id="conf-slider" type="range" min="0.3" max="0.9" step="0.05" value="0.5"/>

      <h3>Per-frame stats</h3>
      <div id="stats"></div>

      <h3>Filters</h3>
      <div id="class-filters"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
